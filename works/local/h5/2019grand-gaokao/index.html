    <script>
        var resize = (function () {
            var bcr = window.document.documentElement.getBoundingClientRect();
            var wr = (bcr.width / bcr.height < 1) ? (bcr.width / bcr.height) : (bcr.height / bcr.width);
            var _width;
            if (wr > 750 / 1106) {
                _width = Math.floor(wr * 1106);
            } else {
                _width = 750;
            }
            var ua = navigator.userAgent;
            if (/Android (\d+\.\d+)/.test(ua)) {
                var version = parseFloat(RegExp.$1);
                if (version > 2.3) {
                    document.write('<meta name="viewport" content="width=' + _width + ',user-scalable=no,target-densitydpi=device-dpi,minimal-ui">')
                } else {
                    document.write('<meta name="viewport" content="width=' + _width + ',target-densitydpi=device-dpi">')
                }
            } else if (/QQAC_Client_iOS/.test(ua)) {
                document.write('<meta name="viewport" content="width=' + _width + ',maximum-scale=0.5,minimum-scale=0.5">');
            } else {
                document.write('<meta name="viewport" content="width=' + _width + ',user-scalable=no,target-densitydpi=device-dpi,minimal-ui">')
            }
            var domEle = window.document.documentElement;
            var timeCode;
            var hwr = wr > 1 ? wr : (1 / wr);
            domEle.style.height = hwr * _width + "px";
            function resize() {
                domEle.style.height = hwr * _width + "px";
            }
            window.addEventListener("resize", function () {
                clearTimeout(timeCode), timeCode = setTimeout(resize, 300)
            }, false);
            return resize;
        })();
    </script>

    <script>
        $('.endpage').css('min-height',window.innerHeight+'px')
        $('.endpage').on('blur','input',function(){
            window.scrollTo(0,window.document.body.scrollTop)
        })
        //音乐播放代码
        var musicFlag = false;
        var playeraudio = null;
        $("#music").click(function () {
            playMusic();
        });
        $(document).ready(function () {
            playMusic();
        });
        //音乐播放
        function playMusic() {
            playeraudio = $("#bgMusic")[0];
            if (musicFlag) {
                $("#music").removeClass("xuanzhuan");
                $("#music").removeClass("music_start");
                musicFlag = false;
                playeraudio.pause();
            } else {
                $("#music").addClass("xuanzhuan");
                $("#music").addClass("music_start");
                musicFlag = true;
                playeraudio.play();
                document.addEventListener("WeixinJSBridgeReady", function () {
                    playeraudio.play();
                }, false);
            }
        }
    </script>
