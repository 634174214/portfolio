  <script>// 动态插入字体并预加载
    (function () {
      const fonts = window.setting.text_fonts;
      const styleEl = document.createElement('style');
      let styleStr = '';
      fonts.forEach((font) => {
        const fileArr = font.file.split('.');
        const type = fileArr[1];
        const family = fileArr[0];
        const fontPath = `text-font/${font.file}`;
        const link = document.createElement('link');
        link.rel = 'preload';
        link.href = fontPath;
        link.as = 'font';
        link.type = `font/${type}`;
        link.setAttribute('crossorigin', '');
        document.head.appendChild(link);

        const fontface = `
            @font-face {
              font-family: '${family}';
              src: url('${fontPath}');
            }
            .font-demo-${family} {
                  font-family: "${family}";
            }
          `;
        styleStr += fontface;
      });
      styleEl.innerHTML = styleStr;
      document.head.appendChild(styleEl);
    })();</script>
