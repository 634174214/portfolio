<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>编辑站点信息</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
<main class="piece-main">
    <section class="piece-container">
        <section class="row">
            <div class="col-6">
                <div class="card">
                   <!-- headline -->
                   <div class="headline">
                       <span class="title">请完善站点的各项信息</span>
                   </div>
                   <!-- headline end -->
                   <div class="inner">
                       <form action="123.php" method="POST" class="piece-form validate">
                        <fieldset class="form-item">
                            <label class="form-label">网站名称</label>
                            <div class="input-block">
                                <input type="text"
                                       name="sitename"
                                       placeholder="请输入网站的名称"
                                       class="input"
                                       data-msg-required="网站的名称不能为空！"
                                       required
                                >
                              </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">关于网站</label>
                            <div class="input-block">
                                <textarea name="description"
                                          rows="4"
                                          placeholder="请输入网站的描述" class="textarea"
                                          required
                                          data-msg-required="网站描述信息不能为空"
                                ></textarea>
                              </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">热门搜索</label>
                            <div class="input-block">
                                <input type="text"
                                       name="myshuo"
                                       placeholder="请输入热门搜索关键词，以 | 作为分隔，如 五四广场 | 青岛 | JQ"
                                       class="input"
                                       data-msg-required="个性签名不能为空！"
                                >
                            </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">看板娘</label>
                            <div class="input-block">
                                <div class="radio-box">
                                    <label for="x4" class="radio">
                                        <div class="radio-inner">
                                            <input type="radio" name="category" id="x4" checked>
                                            <i class="imgicon-checked"></i>
                                        </div>
                                        <p>无</p>
                                    </label>
                                    <label for="x5" class="radio">
                                        <div class="radio-inner">
                                            <input type="radio" name="category" id="x5">
                                            <i class="imgicon-checked"></i>
                                        </div>
                                        <p>看板娘1</p>
                                    </label>
                                    <label for="x6" class="radio">
                                        <div class="radio-inner">
                                            <input type="radio" name="category" id="x6">
                                            <i class="imgicon-checked"></i>
                                        </div>
                                        <p>看板娘2</p>
                                    </label>
                                    <label for="x7" class="radio">
                                        <div class="radio-inner">
                                            <input type="radio" name="category" id="x7">
                                            <i class="imgicon-checked"></i>
                                        </div>
                                        <p>看板娘3</p>
                                    </label>
                                    <label for="x8" class="radio">
                                        <div class="radio-inner">
                                            <input type="radio" name="category" id="x8">
                                            <i class="imgicon-checked"></i>
                                        </div>
                                        <p>看板娘4</p>
                                    </label>
                                </div>
                                <small class="block-tips">请选择详细页显示的看板娘 <a href="#" target="_blank" class="textlink">查看对应的效果</a></small>
                            </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">博客水印</label>
                            <div class="input-block">
                                <input type="text"
                                       name="myshuo"
                                       placeholder="请输入博客水印的内容"
                                       class="input"
                                >
                            </div>
                        </fieldset>
                        
                        <div class="piece-btn-box avg-1 marginTop-ll">
                            <button type="submit" class="piece-btn hot lang">提交网站设置</button>
                        </div>
                       </form>
                   </div>
                </div>
            </div>
        </section>
      </section>
</main>

<script src="../js/libs/requirejs/require.js" data-main="../js/app/normalform" defer async="true"></script>
</body>
</html>
