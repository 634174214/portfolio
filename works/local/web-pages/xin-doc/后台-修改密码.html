  <div class="layui-body">
    <section class="container-wrapper">
      <h1 class="my-h1">修改密码</h1>

      <form class="layui-form" action="">
        <div class="layui-form-item">
            <label class="layui-form-label">设置新密码</label>
            <div class="layui-input-inline">
              <input type="password" name="password" required lay-verify="required" placeholder="请输入新的密码" autocomplete="off" class="layui-input">
              <p class="my-input-error"><i class="layui-icon layui-icon-tips"></i> 抱歉，这里显示验证报错的信息</p>
            </div>
            <div class="layui-form-mid layui-word-aux">* 建议使用字母、数字和符号两种及以上的组合，8-20个字符</div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">再次输入</label>
            <div class="layui-input-inline">
              <input type="password" name="password" required lay-verify="required" placeholder="请输入新的密码" autocomplete="off" class="layui-input">
              <p class="my-input-error"><i class="layui-icon layui-icon-tips"></i> 抱歉，这里显示验证报错的信息</p>
            </div>
            <div class="layui-form-mid layui-word-aux">* 请确保两次输入的密码字符一致</div>
        </div>
        
        <div class="layui-form-item">
          <div class="layui-input-block">
            <button class="layui-btn layui-btn-lg my-submit-fuwu" lay-submit lay-filter="formSubmit" >立即修改</button>
          </div>
        </div>
      </form>
       
    </section>
