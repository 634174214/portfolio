<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>上传管理</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
<main class="piece-main">
    <section class="piece-container">
        <section class="row">
            <div class="col-6">
                <div class="card marginBot-l auto">
                    <!-- headline -->
                   <div class="headline">
                        <span class="title">搜索文件</span>
                    </div>
                    <!-- headline end -->
                    <div class="inner">
                        <form action="GET" class="piece-form marginBot-l">
                          <fieldset class="form-item">
                            <label class="form-label">文章标题</label>
                            <div class="input-block">
                              <input type="text" name="search" placeholder="请输入要搜索的文件名称" class="input w80" value="最多显10个字多了显示">
                              <div class="piece-btn hot w20">搜索</div>
                            </div>
                          </fieldset>
                        </form>
                      </div>
                </div>

                <div class="card">
                   <!-- headline -->
                   <div class="headline">
                       <span class="title">文件列表</span>
                   </div>
                   <!-- headline end -->
                   <div class="inner">
                       <!-- no-result -->
                        <div class="no-result">
                            <img src="../img/nores.svg" class="nores-img">
                            <div class="nores-text">
                            <h2>抱歉！没有找到与 <b>“最多显10个字多了显示.”</b>有关的内容</h2>
                            <small>请更换关键词重试！或者看看其他链接。</small>
                            </div>
                        </div>
                        <!-- no-result end -->
                   </div>
                   <!-- innder end -->
                </div>
            </div>
            <!-- col-6 end -->
        </section>
      </section>
</main>

<script src="../js/libs/requirejs/require.js" data-main="../js/app/normalform" defer async="true"></script>
</body>
</html>
