
<!DOCTYPE html>

<head>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-feature-settings: -apple-system-font, Helvetica Neue, Helvetica, sans-serif;
            font-family: -apple-system, "Microsoft YaHei", "Helvetica Neue", "Arial", "PingFang SC", "Hiragino Sans GB", "STHeiti", "Microsoft JhengHei", "Source Han Sans SC", "Noto Sans CJK SC", "Source Han Sans CN", "Noto Sans SC", "Source Han Sans TC", "Noto Sans CJK TC", "WenQuanYi Micro Hei", SimSun, sans-serif;
        }
        .loader {
            position: fixed;
            top: 55%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 380px;
            height: 380px;
            z-index:100001;
            display: none;
        }

        .ball-spin-fade-loader {
            top: 160px;
            left: 160px;
        }
        .audioCon {
            position: fixed;
            width: 1.8rem;
            height: 1.8rem;
            -webkit-background-size: cover;
            background-size: cover;
            right: 0.8rem;
            top: 40px;
            z-index: 9999;
            -webkit-animation: none;
            background-image: url(imgs/music_pause.png)
        }
        .audioCon.playingZ {
            background-image: url(imgs/music.png);
            -webkit-animation: audio 2s linear infinite
        }
        @-webkit-keyframes audio {
            0% {
                -webkit-transform: rotate3d(0, 0, 1, -360deg);
                transform: rotate3d(0, 0, 1, -360deg)
            }
            50% {
                -webkit-transform: rotate3d(0, 0, 1, -180deg);
                transform: rotate3d(0, 0, 1, -180deg)
            }
            100% {
                -webkit-transform: rotate3d(0, 0, 1, 0deg);
                transform: rotate3d(0, 0, 1, 0deg)
            }
        }
        .audioCon .play-pauseZ {
            width: 100%;
            height: 100%;
            left: 0;
            top: 0
        }
        .audioCon .scrubberZ,
        .audioCon .timeZ {
            display: none
        }
    </style>
    <script src="js/jquery-3.5.1.min.js"></script>
    <script type="text/javascript">
        var posturl = 'https://ssl.qdxin.cn/api/project/jinli2019',
            nickname = '参观者',
            lottery,
            gifttimeb, //抽奖次数
            headimg,
            hadput = 0;
        function getQueryString(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) {
                return decodeURIComponent(r[2]);
            }
            return null;
        }

        function resize() {
            let htmlWidth = document.documentElement.clientWidth || document.body.clientWidth;
            //得到html的Dom元素
            let htmlDom = document.getElementsByTagName('html')[0];
            if (htmlWidth > 750) {
                htmlWidth = 750;
            }
            //设置根元素字体大小
            htmlDom.style.fontSize = htmlWidth / 375 * 25 + 'px';
        }
        resize()
        window.onresize = () => {
            resize()
        }
    </script>
</head>

<body>

            <p class="loadingZ"></p>
        </div>
        <div class="scrubberZ">

            <div class="loadedZ"></div>
        </div>
        <div class="timeZ"><em class="playedZ"></em>/<strong class="durationZ"></strong>
        </div>

    </div>
    <div class="loader" id="loader">

            <div></div>

    <script charset="utf-8" src="js/phaser.min.js"></script>
    <script src="js/game8.js" charset="UTF-8"></script>
    <script charset="utf-8" src="js/loaders.css3.js"></script>
    <script type="text/javascript" src="js/audio.min.js"></script>
    <script>
         $('#endpage').on('blur','input',function(){
            window.document.body.scrollTop = window.document.body.scrollHeight
        })
    </script>
    <script type="text/javascript">
        audiojs.events.ready(function () {
            var as = audiojs.create(document.getElementsByTagName("audio")[0], {
                css: false,
                createPlayer: {
                    markup: false,
                    playPauseClass: 'play-pauseZ',
                    scrubberClass: 'scrubberZ',
                    progressClass: 'progressZ',
                    loaderClass: 'loadedZ',
                    timeClass: 'timeZ',
                    durationClass: 'durationZ',
                    playedClass: 'playedZ',
                    errorMessageClass: 'error-messageZ',
                    playingClass: 'playingZ'
                }
            });
        });
        document.addEventListener('WeixinJSBridgeReady', function onBridgeReady() {
            WeixinJSBridge.invoke('getNetworkType', {},
                function (e) {
                    document.getElementsByTagName("audio")[0].play();
                });
        }, false);
    </script>
    <script>
        function onShareComplete(res) {
            //window.location.href='';
        }
        document.addEventListener('WeixinJSBridgeReady', function onBridgeReady() {
            WeixinJSBridge.on('menu:share:appmessage', function (argv) {
                WeixinJSBridge.invoke('sendAppMessage', {
                    "img_url": window.shareData.imgUrl,
                    "link": window.shareData.timeLineLink,
                    "desc": window.shareData.tContent,
                    "title": window.shareData.tTitle
                }, onShareComplete);
            });
            WeixinJSBridge.on('menu:share:timeline', function (argv) {
                WeixinJSBridge.invoke('shareTimeline', {
                    "img_url": window.shareData.imgUrl,
                    "img_width": "320",
                    "img_height": "320",
                    "link": window.shareData.timeLineLink,
                    "desc": window.shareData.tContent,
                    "title": window.shareData.tTitle
                }, onShareComplete);
            });
        }, false);
    </script>
</body>
</html>
