    <script>
        var resize = (function () {
            var bcr = window.document.documentElement.getBoundingClientRect();
            var wr = (bcr.width / bcr.height < 1) ? (bcr.width / bcr.height) : (bcr.height / bcr.width);
            var _width;
            if (wr > 750 / 1106) {
                _width = Math.floor(wr * 1106);
            } else {
                _width = 750;
            }
            var ua = navigator.userAgent;
            if (/Android (\d+\.\d+)/.test(ua)) {
                var version = parseFloat(RegExp.$1);
                if (version > 2.3) {
                    document.write('<meta name="viewport" content="width=' + _width + ',user-scalable=no,target-densitydpi=device-dpi,minimal-ui">')
                } else {
                    document.write('<meta name="viewport" content="width=' + _width + ',target-densitydpi=device-dpi">')
                }
            } else if (/QQAC_Client_iOS/.test(ua)) {
                document.write('<meta name="viewport" content="width=' + _width + ',maximum-scale=0.5,minimum-scale=0.5">');
            } else {
                document.write('<meta name="viewport" content="width=' + _width + ',user-scalable=no,target-densitydpi=device-dpi,minimal-ui">')
            }
            var domEle = window.document.documentElement;
            var timeCode;
            var hwr = wr > 1 ? wr : (1 / wr);
            domEle.style.height = hwr * _width + "px";
            function resize() {
                domEle.style.height = hwr * _width + "px";
            }
            window.addEventListener("resize", function () {
                clearTimeout(timeCode), timeCode = setTimeout(resize, 300)
            }, false);
            return resize;
        })();


        if (/AppleWebKit.*Mobile/i.test(navigator.userAgent) || (/MIDP|SymbianOS|NOKIA|SAMSUNG|LG|NEC|TCL|Alcatel|BIRD|DBTEL|Dopod|PHILIPS|HAIER|LENOVO|MOT-|Nokia|SonyEricsson|SIE-|Amoi|ZTE/.test(navigator.userAgent))) {
            // 移动端禁止滑动
            document.addEventListener("touchmove", function (e) {
                if(isStop){
                    e.preventDefault()
                }
            }, { passive: false })
        } else {
            document.documentElement.className = 'pc-page';
        }
    </script>

<script>
    let musicFlag = false;
    $("#music").click(function () {
        playMusic();
    });
    $(document).ready(function () {
        playMusic();
    });
    //音乐播放
    function playMusic() {
        let player = $("#bgMusic")[0];
        if (musicFlag) {
            $("#music").removeClass("xuanzhuan");
            $("#music").removeClass("music_start");
            musicFlag = false;
            player.pause();
        } else {
            $("#music").addClass("xuanzhuan");
            $("#music").addClass("music_start");
            musicFlag = true;
            player.play();
            document.addEventListener("WeixinJSBridgeReady", function () {
                player.play();
            }, false);
        }
    }
</script>

    function onShareComplete(res) {
        //window.location.href='';
    }
    document.addEventListener('WeixinJSBridgeReady', function onBridgeReady() {
        WeixinJSBridge.on('menu:share:appmessage', function (argv) {
            WeixinJSBridge.invoke('sendAppMessage', {
                "img_url": window.shareData.imgUrl,
                "link": window.shareData.timeLineLink,
                "desc": window.shareData.tContent,
                "title": window.shareData.tTitle
            }, onShareComplete);
        });
        WeixinJSBridge.on('menu:share:timeline', function (argv) {
            WeixinJSBridge.invoke('shareTimeline', {
                "img_url": window.shareData.imgUrl,
                "img_width": "320",
                "img_height": "320",
                "link": window.shareData.timeLineLink,
                "desc": window.shareData.tContent,
                "title": window.shareData.tTitle
            }, onShareComplete);
        });
    }, false);
</script>
