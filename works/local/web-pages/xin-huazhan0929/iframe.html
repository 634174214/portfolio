<!DOCTYPE html >
<html >
<head>   
     <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
     <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"> 
     <meta name="apple-mobile-web-app-capable" content="yes" /> 
     <meta content="telephone=no" name="format-detection" />
     <meta content="black" name=" apple-mobile-web-app-status-bar-style" />
     <meta name="description" content="喜迎二十大 翰墨颂党恩，青岛市民营经济书画展，主办单位：青岛市民营经济发展局，中国致公党青岛市委员会。" />
     <title>喜迎二十大 翰墨颂党恩-青岛市民营经济书画展 | 信网</title> 
     <style type="text/css">
         *{padding: 0;margin: 0;}
         body{background-color: #000;}
         html,body{height: 100%;}
         body{text-align: center;}
         .loading{
            position: fixed;
            top: 0;left: 0;right: 0;bottom: 0;background-image: url(img/loading-pc.gif);background-repeat: no-repeat;background-position: center center;
         }
         img{
            height: 100%;
         }
         img.heng-1{
            width: 100%;
            height: auto;
            margin-top: 12%;
         }
         img.heng-2{
            width: 80%;
            height: auto;
            margin-top: 4%;
         }
         img.heng-3{
            width: 60%;
            height: auto;
            margin-top: 4%;
         }
        .seelink{position: fixed;left: 20px;top:20px;background: #ffc107;padding: 10px 15px;text-decoration: none;border-radius: 10px;color: #fff;z-index: 99;}
        @media screen and (max-width: 640px) {
            body{
                padding-top: 50px;
            }
            .hengimgbox{
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
                min-height: 100vh;
                padding-top: 0px;
            }
            .seelink{
                display: none;
            }
            img{
                width: 100%!important;
                height: auto;
                margin-top: 0;
            }
        }
     </style>
     <script type="text/javascript">
         var imgsrc = window.location.href.split('?src=')[1];

         var isMobile = function() {
           if ((navigator.userAgent.match(/(iPhone|iPod|Android|ios|iOS|iPad|Backerry|WebOS|Symbian|Windows Phone|Phone)/i))) {
                 return true;
           }
           return false;
         }();

         var img = new Image();
         img.src = imgsrc;
         img.addEventListener('load', function() {
            document.getElementById('loading').style.display = 'none';
            if (isMobile) {
                if (this.width > this.height) {
                    document.body.className = 'hengimgbox';
                }
            } else {
                // 如果是pc
                console.log(this.width / this.height);
                switch(true) {
                    case this.width / this.height > 1.3 && this.width / this.height <= 1.7:
                        this.className = 'heng-3';
                        break;
                    case this.width / this.height > 1.7 && this.width / this.height <= 2:
                        this.className = 'heng-2';
                        break;
                    case this.width / this.height > 2:
                        this.className = 'heng-1';
                        break;  
                }
            }
            
            document.body.appendChild(this);
         });
     </script>
</head>
<body>
    <a class="seelink" id="seelink" target="_blank">查看原图</a>
    <div class="loading" id="loading"></div>

    <script>
        document.getElementById('seelink').href = imgsrc;
    </script>
</body>
</html>
