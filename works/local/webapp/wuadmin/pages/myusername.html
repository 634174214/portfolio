<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>修改我的用户名</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
<main class="piece-main">
    <section class="piece-container">
        <section class="row">
            <div class="col-6">
                <div class="card">
                   <!-- headline -->
                   <div class="headline">
                       <span class="title">修改个人用户名</span>
                   </div>
                   <!-- headline end -->
                   <div class="inner">
                       <!-- data-layer-passmsg通过验证后点击提交弹窗提示 -->
                       <form action="#" method="POST" class="piece-form validate" data-layer-passmsg="用户名修改成功，请重新登陆！">
                            <fieldset class="form-item">
                                <label class="form-label">旧用户名</label>
                                <div class="input-block">
                                    <input type="text"
                                           name="oldname"
                                           placeholder="请输入旧的密码" class="input"
                                           required
                                           data-msg-required="旧密码不能为空！"
                                           data-rule-numstring="true"
                                           data-msg-numstring="用户名必须是数字或字母的组合"
                                    >
                                </div>
                            </fieldset>
                            <fieldset class="form-item">
                                <label class="form-label">新用户名</label>
                                <div class="input-block">
                                    <input type="text"
                                    name="newname"
                                    placeholder="请输入新的用户名名称,最多12个字符"
                                    class="input"
                                    required
                                    data-msg-required="请输入新的用户名名称！"
                                    data-rule-numstring="true"
                                    data-msg-numstring="用户名必须是数字或字母的组合"
                                    maxlength="12"
                                    data-msg-maxlength="用户名名称不能超过12个字符"
                                    >
                                </div>
                            </fieldset>
                            <div class="piece-btn-box avg-1 marginTop-ll">
                                <button type="submit" class="piece-btn hot lang">提交用户名修改</button>
                            </div>
                       </form>
                   </div>
                </div>
            </div>
        </section>
      </section>
</main>

<script src="../js/libs/requirejs/require.js" data-main="../js/app/userinfo" defer async="true"></script>
</body>
</html>
