<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>新建/编辑文章分类</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
<main class="piece-main">
   <section class="piece-container">
     <section class="row">
         <div class="col-6">
             <div class="card">
                <!-- headline -->
                <div class="headline">
                    <span class="title">编辑文章分类</span>
                </div>
                <!-- headline end -->
                <div class="inner">
                    <form action="POST" class="piece-form validate" id="category-form">
                        <fieldset class="form-item">
                            <label class="form-label">分类名称</label>
                            <div class="input-block">
                                <input type="text" name="category-title" placeholder="请输入分类名称" class="input error" data-msg-required="分类名称不能为空！" required>
                              </div>
                        </fieldset>
                        <fieldset class="form-item marginBot-l">
                            <label class="form-label">分类描述</label>
                            <div class="input-block">
                                <textarea name="category-desc" rows="4" placeholder="请输入对此分类的描述" class="textarea error" required="" data-msg-required="分类描述不能为空"></textarea>
                            </div>
                        </fieldset>
                        <div class="piece-btn-box avg-1">
                            <button type="submit" class="piece-btn hot big lang">提交分类目录</button>
                        </div>
                    </form>
                </div>
             </div>
         </div>
     </section>
   </section>
</main>

<script src="../js/libs/requirejs/require.js" data-main="../js/app/normalform" defer async="true"></script>
</body>
</html>
