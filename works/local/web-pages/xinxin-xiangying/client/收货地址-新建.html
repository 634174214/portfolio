<div class="address-manage all-margin_top">
    <div class="address-addnew">
        <form action="#" id="address-addnew">
            <ul>
                <li>
                    <label for="name">收货人</label>
                    <input type="text" name="name" id="name" placeholder="请填写收货人姓名">
                    <p><em class="weui-icon-warn"></em>收货人姓名不能为空！</p>
                </li>
                <li>
                    <label for="tel">手机号</label>
                    <input type="tel" name="number" id="tel" placeholder="请填写收货人手机号">
                    <p><em class="weui-icon-warn"></em>请填写正确的手机号！</p>
                </li>
                <li>
                    <label for="address">收货地址</label>
                    <textarea id="address" placeholder="请填写详细收货地址"></textarea>
                    <p><em class="weui-icon-warn"></em>收货地址不能为空！</p>
                </li>
            </ul>
        </form>
        <div class="address-new-wrapper">
            <input type="submit" class="normal-btn" value="保存收货地址" id="address-save">
        </div>
    </div>
</div>
