          </div>
          <form action="#" id="goods-form">
            <input type="text" name="goods" placeholder="请输入核销验证码 " id="sale-goods">
            <input type="submit" value="核销查询" id="sale-submit">

<script src="js/jxinq111.js"></script>
<script src="http://res2.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
<script src="js/index.js"></script>
<script>
$('form').on('submit', function() {
  var goodsNum = $('#sale-goods').val();
  if (goodsNum === '') {
    $('form').addClass('error');
    return false;
  } else {
     $('form').removeClass('error');
     window.open('核销商品-2.html'); // 跳转效果
     return true;
  }
});
</script>
<script>
 // 核销商品摄像头调用
 $('#QRcode').on('click', function() {
  wx.scanQRCode({
    needResult: 1, // 默认为0，扫描结果由微信处理，1则直接返回扫描结果，
    scanType: ["qrCode","barCode"], // 可以指定扫二维码还是一维码，默认二者都有
    success: function (res) {
    var result = res.resultStr; // 当needResult 为 1 时，扫码返回的结果
    }
  });
 });
</script>
