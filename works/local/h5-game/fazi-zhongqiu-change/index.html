<script type="text/javascript">
var loadImage = function(url, callback) {
    var img = new Image();
    img.src = url;
    if (img.complete) {
        callback.call(img);
        return;
    };
    img.onload = function() {
        callback.call(img);
    };
};
var imgLoad = function(srcs, callback) {
    var srcs = srcs || [];
    var len = srcs.length;
    if (len < 1)
        return;
    // 记录加载长度
    var loadNum = 0;
    var loading_p = 0;
    var loading = function() {
        if (loadNum < len) {
            loading_p = Math.ceil(100 * loadNum / len);
            var _src = srcs[loadNum];
            loadImage(_src, function(img) {
                loadNum++;
                callback && callback(loading_p);
                loading();
            });
        } else {
            loading_p = '100';
            callback && callback(loading_p);
        };
    }
    loading();
};
var initPage = function() {
    var _img = $('.swiper-container img');
    var arr = [];
    _img.each(function(i, v) {
        var _src = $(v).attr('src');
        if (_src) {
            arr.push(_src);
        };
    });

    var obj = {
        num : 0,
        timer : null
    };

    imgLoad(arr, function(num) {
        obj.timer && clearTimeout(obj.timer);
        if (num >= 100) {
            num = 100;
            // obj.timer = setTimeout(initSwiper,500);
        };
        if (num == 100) {
        }
    });
};
initPage();
</script>

<script type="text/javascript">
var springBox = $(".springBox");
var springBoxWidth = springBox.width();
var springBoxHeight = springBox.height();
var icoTimeout_min = 700;         // 泡温泉最小时间
var icoTimeout_threshold = 800;   // 泡温泉阈值
var manid = 0;
var score = 0;
//var gameTime = 3000;
var gameTime = 16000;
var time = 15;
var data_Top10 = [];
var icoArray = [
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                "img/U10478P1534DT20150828101212.png",
                ];
var icoLArray = [
                 "img/U10478P1534DT20150828101511.png",
                 "img/U10478P1534DT20150828101511_1.png",
                 "img/U10478P1534DT20150828101511_1_1.png",
                 "img/U10478P1534DT20150828101512.png",
                 "img/U10478P1534DT20150828101512_1.png",
                 "img/U10478P1534DT20150828101512_1_1.png",
                 "img/U10478P1534DT20150828101512_1_1_1.png",                 
                 ];

function icoAct() {
    $(".ico").bind("touchstart mousedown",function (){event.preventDefault(); icoEventHandle($(this))});
}

function icoEventHandle(dom){
    dom.unbind();;
    score++;
    var sid = parseInt(dom.attr("sid"));
    var randomTime = icoTimeout_min + Math.random() * icoTimeout_threshold;
    console.log(sid + " t:" + randomTime);
    springAddHandle(sid, randomTime);
    dom.css({opacity: 1, scale: 1}).transition({opacity: 0,scale: 0.8},60);
    setTimeout(function() {
        dom.css({opacity: 0, scale: 1}).transition({opacity: 1},120);
        dom.bind("touchstart mousedown",function (){icoEventHandle(dom)});
    }, randomTime)
}

function springAddHandle(sid, randomTime) {
    var random_x = Math.random() * springBoxWidth;
    var random_y = Math.random() * springBoxHeight;
    random_y = ( sid === 6 ) ? random_y - 50 : random_y ;
    var thisid = manid;
    console.log(thisid);

    var html = "";
    html+= '<img src="' + icoLArray[sid-1] + '"class="man man_' + thisid + '"  style="position:absolute; left:' + random_x + 'px; top:' + random_y + 'px; z-index:' + random_y.toFixed(0) +";";
    if (Math.random()>0.5) {
        var scaleX = "-webkit-transform:scaleX(-1); transform:scaleX(-1);";
        html+= scaleX;
    }
    html+= '"/>';
    springBox.append(html);

    /* Do not remove man in spring */
    /* 
    var dom = $(".man_" + thisid);
    setTimeout(function() {
            dom.css({opacity: 1}).transition({opacity: 0},400,function(){
                dom.remove(); //$(".man").remove(dom);
                console.log(thisid + "removed");
        });
    }, randomTime);
     */
    manid++;
}

function reset(){
    manid = 0;
    score = 0;
    time = 16;
    $(".ico").unbind();
    $(".man").remove();
}

function gamestart(){
    reset();
    $(".startBtn").unbind();
    $("#p1").css({x: '0px'}).transition({x: '-640px'},800,"cubic-bezier(.83,-0.26,.28,1.28)",function(){
        $("#p2").fadeIn();
    });

    //start
    icoAct();

    //gametime
    setTimeout(function () {
        gameover();
    }, gameTime);

    startTimer();
}

function startTimer() {
    var timeDom = $(".time");
    t = setInterval(function() {
        time -= 0.1;
        if(time <= 0){
            timeDom.text("0");
            clearInterval(t);
            return;
        }
        timeDom.text(time.toFixed(0));
    }, 100);
}

function gameover() {

    $(".score").text(score);
    document.title = "土豪我射了" + score + "个嫦娥姐姐，玩“全民射嫦娥”赢中秋“约”会！";

        /* 进入前10 */
        $(".popup2").show();
        $(".popup2_2").hide();
        $(".cover").hide();

    $("#p2").fadeOut();
    $("#wrap_2").fadeIn();
    $(".startBtn").unbind().bind("click",function(){
        gamestart();
    });

}

function onceAgain() {
    $('#wrap_2').fadeOut(200);
    $("#p2").fadeOut(200);
    $("#p1").css({x: '-640px'}).transition({x: '0px'},800,"cubic-bezier(.83,-0.26,.28,1.28)",function(){
        $(".cover").hide();
    });
}

function getTop10( callback ) {
    var top10List = $(".top10List");
    var html = "";

    $.JSONP('http://act.city.sina.com.cn/interface/activity/json_get_user_works.php',{act_id:12535,pcount:9999},function(json){
        for(var i=0; i<json.count; i++){
            var phone = json.data[i].form_data.custom_1.value;
            phone = phone.substr(0,3) + "****" + phone.substr(7,4);
            var score = parseInt(json.data[i].form_data.custom_2.value);
            data_Top10[i] = [phone, score];
        }

        var len = data_Top10.length; 
        var tmp = [];
        for(var i = 0; i<len; i++){
            for(var j=len-1; j>i; j--){
                if(data_Top10[j][1] > data_Top10[j-1][1]){
                    tmp = data_Top10[j-1];
                    data_Top10[j-1] = data_Top10[j];
                    data_Top10[j] = tmp;
                }
            }
        }

        for (var i = 0; i < 10; i++) {
            if (data_Top10[i]==null | data_Top10[i] == undefined) {
                continue;
            }
            var no = i + 1;
            no = (no<=9) ? ("0" + no) : no;
            html += '<li><span class="no">'+ no +'</span><span class="u_phone">'+ data_Top10[i][0] +'</span><span class="u_score">'+ data_Top10[i][1] +'分</span></li>';
        }

        top10List.html(html);
