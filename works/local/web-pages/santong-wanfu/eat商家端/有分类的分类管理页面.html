<html>
<head>

	<title>分类管理</title>
	<!-- 重置/公用样式 -->

<body ontouchstart>
<!-- 添加新分类 -->
<div class="btnnew f17" onClick="window.location.href='填写分类信息页面.html';">
         添加新分类
</div>
<!-- 添加新分类END -->
<!-- 分类详情 -->
<div class="basicmid padd_lr">
           <table class="classify f16 fcdark">
               <tbody>
                   <tr>
                       <td>牛排系列</td>
                      <td>
                          <div class="btnedit fl-l" onClick="window.location.href='修改分类信息页面.html';">修改</div>
                          <div class="btndel fl-r" onclick = "document.getElementById('light').style.display='block';document.getElementById('fade').style.display='block'">删除</div>
                      </td>
                   </tr>
                   <tr>
                       <td>新疆最最最最最最最牛逼的系列</td>
                       <td>
                               <div class="btnedit fl-l">修改</div>
                               <div class="btndel fl-r" onclick = "document.getElementById('light').style.display='block';document.getElementById('fade').style.display='block'">删除</div>
                       </td>
                   </tr>
                   <tr>
                       <td>炒面系列</td>
                       <td>
                               <div class="btnedit fl-l">修改</div>
                               <div class="btndel fl-r" onclick = "document.getElementById('light').style.display='block';document.getElementById('fade').style.display='block'">删除</div>
                       </td>
                   </tr>
                   <tr>
                       <td>其他</td>
                       <td>
                               <div class="btnedit fl-l">修改</div>
                               <div class="btndel fl-r" onclick = "document.getElementById('light').style.display='block';document.getElementById('fade').style.display='block'">删除</div>
                       </td>
                   </tr>
               </tbody>
           </table>
</div>
<!-- 分类详情END -->
<!-- 返回首页 -->
<div class="btnback f17 fcwhite" onClick="window.location.href='总店管理后台页面.html';">
        返回首页
</div>
<!-- 返回首页END -->

<!-- 弹窗删除 -->
<div id="light" class="white_content">
            <div class="qtext">
                <strong>确认删除</strong>
                <div class="qask">
                       确认删除此分类？
                </div>
            </div>
            <div>
                   <a href="javascript:void(0)" onclick = "document.getElementById('light').style.display='none';document.getElementById('fade').style.display='none'">取消</a>
                  <a href="javascript:void(0)" onclick = "document.getElementById('light').style.display='none';document.getElementById('fade').style.display='none'">确定</a>
             </div>
</div> 
<div id="fade" class="black_overlay"></div> 
<!-- 弹窗页面END -->
</body>
<script type="text/javascript" src="http://libs.qdxin.cn/basic/js/jquery-1.11.1.min.js"></script>
<script type="text/javascript" src="JS/jquery-weui.js"></script>
<script type="text/javascript" src="JS/main.js"></script>
<script>
$("#sname").blur(function(){
  if($(this).val()==""){
        $("#tip_sname").show();
    }
    else{
        $("#tip_sname").hide();
    }
});
$(".btnsure.fl-r").on("click",function(){
    if(!$("#sname").val()){
        $("#tip_sname").show();
    }else{
        var sname = $("#sname").val();
        var no = $("#no").val();
        $.ajax({ 
            type: 'POST', 
            url: 'sortHandle.php',
            data: {sname:sname, no:no, ac:'add'}, 
            error: function(){ 
                alert('出错了！'); 
                return false; 
            }, 
            success:function(json){ 
                var json = eval('('+json+')'); 
                if(json.state == 1){
                    $(".loc").attr("href", "sort.php");
                }
                $(".qask").text(json.msg);
                $('#light').css("display", "block");
                $('#fade').css("display", "block");
            }
        });
    }
});
$(".qone").on("click",function(){
    $('#light').css("display", "none");
    $('#fade').css("display", "none");
});
</script>
</html>
