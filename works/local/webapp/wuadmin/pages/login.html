<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>登陆wubin.work</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/sign-pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/sign-m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
    <section class="login">
        <div class="login-top">
            <img src="../img/login-man.png?t=133" class="login-man">
        </div>
        <form class="login-form" id="login-form">
            <fieldset class="form-group gray-bg">
                <input type="text"
                       class="input input-control"
                       name="username"
                       placeholder="请输入用户名"
                       id="username"
                >
                <label class="label-control username" for="username"></label>
            </fieldset>
            <fieldset class="form-group gray-bg">
                <input type="password"
                       class="input input-control"
                       placeholder="请输入登录密码"
                       name="password"
                       id="password"
                >
                <label class="label-control password" for="password"></label>
            </fieldset>
            <fieldset class="form-group verify">
                <div class="v-code" id="v-code">
                    <div class="refresh-vcode" id="refresh-vcode">
                        <i class="icon fas fa-redo-alt"></i>
                    </div>
                    <img src="http://localhost/gd/gif-captcha/gifcaptcha.class2.php" alt="点击刷新验证码">
                </div>
                <label class="label" for="verify">验证码</label>
                <input type="text"
                       name="verify"
                       id="verify"
                       maxlength="4"
                       class="input"
                       placeholder="不区分大小写"
                >
            </fieldset>
            <fieldset class="form-group remember">
                <label for="s2" class="checkbox">
                    <div class="checkbox-inner">
                        <input type="checkbox" name="remember" id="s2">
                        <span class="imgicon-checked"></span>
                    </div>
                    <p>记住登陆</p>
                </label>
                <a href="login-forget.html" class="forget-psd">已有账号 忘记密码？</a>
            </fieldset>
            <fieldset class="form-group">
                <button type="submit" class="sign-btn">登 陆</button>
            </fieldset>
        </form>
    </section>

    <section class="login-menu">
        <a href="#">首页</a>
        <a href="#">合作</a>
        <a href="#">简历</a>
        <a href="#">工具</a>
        <a href="#">资源</a>
        <a href="#">采集</a>
        <a href="#">留言</a>
        <a href="#">发现更多</a>
    </section>

    <canvas id="canvas" class="canvas-bg"></canvas>
    <script src="../js/libs/requirejs/require.js" data-main="../js/app/login" defer async="true"></script>
</body>
</html>
