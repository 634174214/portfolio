             <ul>
             	<li>
             		<h5>Q1: 怎么获得积分？</h5>
             		<p>在线支付的订单将获得订单积分奖励：可获得积分=订单金额×10（即1元=10点积分）。
			订单金额指实际付款金额，不包含活动优惠金额。每位用户每天最多可以获得2000积分，
			体验商家的订单不会增加积分。</p>
             	</li>
             	<li>
             		<h5>Q2: 积分有效期说明</h5>
             		<p>积分获取后有效期为1年。我们会定期对您上个年度获取后未使用的积分进行过期处理，过期未使用的积分将自动扣除。例：2015年12月31日将扣除2015年1月1日之前所获取后未使用的积分。</p>
             	</li>
             	<li>
             		<h5>Q3: 积分用来做什么？</h5>
