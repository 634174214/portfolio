  <body class="bg-white">
    <!-- header -->
    <div class="header">
        <div class="header-inner">
            <a class="header-left" href="登录.html">
                <img src="img/logo.png" class="header-logo">
                <span class="header-welcome">欢迎您</span>
            </a>
            <div class="header-right">
                <!-- 还未注册?<a href="注册.html" class="a-link">请注册 ></a> -->
                <span class="user-name">您好：17598236899</span>
                <a href="后台-我的订单.html" class="a-link-yellow">
                   <i class="fa fa-user"></i> 管理
                </a> <a href="#" class="a-link-yellow"> 
                   <i class="fa fa-sign-out"></i> 退出账号 
                </a> 
            </div>
        </div>
    </div>
    <!-- header end -->
    
    <section class="qr-container">
        <div class="go-back"><i class="fa fa-chevron-left"></i> 返回</div>
        
        <div class="qr-wrapper">
            <h1 class="qr-h1 font-song">2023年第一季度青企社会关注度白皮书</h1>
            <div class="qr-pay">
                <p class="qr-pay-piece">应付金额：12元</p>
                <div class="qr-pay-code">
                    <img src="https://ssl.qdxin.cn/api.tech/qrcode.php?data=https://www.qdxin.cn/qingdao/2023/302667.html">
                    <p class="qr-pay-tip">请长按二维码识别</p>
                </div>
                <div class="qr-wx-icons">
                    <img src="img/icon-wx.png">
                    <span>微信支付</span>
                </div>
                <div class="qr-tips">
                    ⽀付后请勿关闭窗⼝请等待,系统⾃动返回下载⻚⾯ <cite class="red" id="buyok-count-down"></cite>
                </div>
            </div>
        </div>

    </section>
    

    <script src="https://www.qdxin.cn/js/xinquery.js"></script>
    <script src="js/layer/layer.js"></script>
    <script src="js/common.js"></script>
    <script>
        var COUNT_DOWN = 5;
        var timer = null;

        // 这里仅仅通过点击模拟扫码实现后的交互效果
        $('.qr-pay-code').on('click', function() {

            /* 可以参考的倒计时以及成功后的提示实现 */
            layer.msg('恭喜您购买成功,即将返回下载页');
            $('#buyok-count-down').text('（' + COUNT_DOWN + 's）');
            timer = setInterval(function() {
                COUNT_DOWN--;
                $('#buyok-count-down').text('（' + COUNT_DOWN + 's）');
                if(COUNT_DOWN <= 0) {
                    clearInterval(timer);
                    window.location.href = '前台-微信购买成功.html';
                }
            }, 1000);
            /* 可以参考的倒计时以及成功后的提示实现 */

        });
    </script>
