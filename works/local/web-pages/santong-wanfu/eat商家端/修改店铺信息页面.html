             <!-- textarea超出高度自适应JS -->
                <script type="text/javascript"> 
                        // 最小高度 
                        var minHeight = 60; 
                        // 最大高度，超过则出现滚动条 
                        var maxHeight = 100; 
                        function ResizeTextarea(){ 
                        var t = document.getElementById('txtContent'); 
                        h = t.scrollHeight; 
                        h = h > minHeight ? h : minHeight; 
                        h = h > maxHeight ? maxHeight : h; 
                        t.style.height = h + "px"; 
                        } 
                </script>

<!-- 鸿健上传模块JS -->
<script type="text/javascript">
    $(function(){
    $('#filePicker').diyUpload({
        //type:'POST';
        url:'/fileupload.php',
        //dataType:'json';
        fileNumLimit:20, //图片个数限制
        fileSizeLimit:10000 * 1024, //文件总大小限制
        fileSingleSizeLimit:10000 * 1024, //单张图片大小限制。10M

        success:function( data ) {
            movePicker();
        },
        error:function( err ) {
            console.info( err );    
        }
    });
    function movePicker(){
        $(".diyStart").text("上传成功");
        $(".filePickerLoad").hide();
    }

})
</script>
