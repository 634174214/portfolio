<body class="preload">
<main class="piece-main">
   <section class="piece-container">
     <section class="row">
         <div class="col-6">
             <div class="card">
                <!-- headline -->
                <div class="headline">
                    <span class="title">编辑标签</span>
                </div>
                <!-- headline end -->
                <div class="inner">
                    <form action="3456.php" method="POST" class="piece-form validate" id="category-form">
                        <fieldset class="form-item">
                            <label class="form-label">标签名称</label>
                            <div class="input-block">
                                <input type="text"
                                       name="tag-name"
                                       placeholder="请输入标签名称" class="input"
                                       data-msg-required="标签名称不能为空！"
                                       required
                                >
                              </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">标签链接</label>
                            <div class="input-block">
                                <input type="text"
                                       name="tag-url"
                                       placeholder="请输入分类名称" class="input"
                                       data-msg-required="分类名称不能为空！"
                                       required
                                       data-rule-url="true"
                                       data-msg-url="请输入正确的url地址"
                                >
                              </div>
                        </fieldset>
                        <div class="piece-btn-box avg-1 marginTop-ll">
                            <button type="submit" class="piece-btn hot big lang" >提交标签</button>
                        </div>
                    </form>
                </div>
             </div>
         </div>
     </section>
   </section>
</main>
