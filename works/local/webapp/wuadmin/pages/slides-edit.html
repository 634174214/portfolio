<!doctype html>
<html lang="en">
<head>   
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" /> 
    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>
    <title>编辑轮播内容</title>    
    <meta name="description" content="WuBin.work | 内容管理平台" />
    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->
    <!--[if IE]>
        <script src="../libs/base/html5shiv.min.js"></script>
        <script src="../libs/base/respond.src.js"></script>
    <![endif]-->
</head>
<body class="preload">
<main class="piece-main">
    <section class="piece-container">
        <section class="row">
            <div class="col-6">
                <div class="card">
                   <!-- headline -->
                   <div class="headline">
                       <span class="title">编辑轮播内容</span>
                   </div>
                   <!-- headline end -->
                   <div class="inner">
                       <form action="123.php" method="POST" class="piece-form validate">
                        <fieldset class="form-item">
                            <label class="form-label">文字描述</label>
                            <div class="input-block">
                                <input type="text"
                                       name="slide-desc"
                                       placeholder="请输入轮播的文字描述，按照一定格式如：如你所愿 如约而至"
                                       class="input"
                                       data-msg-required="轮播文字描述不能为空！"
                                       required
                                >
                              </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">按钮文字</label>
                            <div class="input-block">
                                <input type="text"
                                       name="slide-btn"
                                       placeholder="请输入轮播按钮链接的文字"
                                       class="input"
                                       data-msg-required="轮播链接按钮描述不能为空！"
                                       required
                                >
                              </div>
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">轮播链接</label>
                            <div class="input-block">
                                <input type="text"
                                       name="myshuo"
                                       placeholder="请输入轮播指向的链接"
                                       class="input"
                                       data-rule-url="true"
                                       data-msg-url="请输入正确的链接地址！"
                                       required
                                       data-msg-required="轮播链接不能为空！"
                                >
                            </div>
                        </fieldset>
                        <fieldset class="form-item piece-upload">
                            <label class="form-label">轮播图片</label>
                            <div class="input-block">
                                <div class="piece-btn pick-imgone" id="silde-pick">点击上传轮播图片</div>
                                <small class="btn-tips">仅支持jpg/png格式，轮播尺寸 1920 X 1080</small>
                                <ul class="upimg-list">
                                    <li class="item">
                                        <img src="../images/avatar.png">
                                        <p class="name">333</p>
                                        <p class="status error">上传失败</p>
                                    </li>
                                </ul>
                            </div>
                            <input type="hidden" name="mywechatqr">
                        </fieldset>
                        <fieldset class="form-item">
                            <label class="form-label">立即显示</label>
                            <div class="input-block">
                                <label for="s2" class="checkbox center">
                                    <div class="checkbox-inner">
                                        <input type="checkbox" name="show" id="s2" class="valid">
                                        <span class="imgicon-checked"></span>
                                    </div>
                                    <p>立即显示</p>
                                </label>
                            </div>
                        </fieldset>
                        
                        <div class="piece-btn-box avg-1 marginTop-ll">
                            <button type="submit" class="piece-btn hot lang">提交轮播</button>
                        </div>
                       </form>
                   </div>
                </div>
            </div>
        </section>
      </section>
</main>

<script src="../js/libs/requirejs/require.js" data-main="../js/app/slides-edit" defer async="true"></script>
</body>
</html>
