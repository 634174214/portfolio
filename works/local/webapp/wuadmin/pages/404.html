    <meta content="black" name=" apple-mobile-web-app-status-bar-style"/>

    <link rel="stylesheet" href="../css/pc.css" media="(min-width: 641px)"/>
    <link rel="stylesheet" href="../css/m.css" media="(max-width:640px)"/>
    <!-- 特别注意上下的顺序 -->

<body class="preload">
    <!-- 左边栏导航 -->
    <aside class="piece-left-aside fixed">
        <a href="login.html" class="logo">
            <h2>WuBin.work<em>Admin</em></h2>
            <small>内容管理平台</small>
        </a>
        <section class="peice-tree" id="peice-tree">
            <div class="tree-item">
                <a href="admin.html" class="child">
                    <i class="fal fa-home-alt"></i>
                    <em>主页</em>
                </a>
            </div>
            <div class="tree-item">
                <span class="child">
                    <i class="fal fa-book"></i>
                    <em>博客</em>
                </span>
                <ul class="child-list">
                    <li>
                        <a href="blog-editor.html">写文章</a>
                    </li>
                    <li>

                    </li>
                    <li>

            <div class="tree-item">

                </a>

                    <em>站点设置</em>

                <i class="fal fa-globe"></i>
            </a>
            <a href="siteinfo.html" class="item">
                <i class="fal fa-cog"></i>
            </a>
            <!-- 关于返回、刷新iframe方法均在piece-iframe中 -->
            <span class="item" id="reload">
                <i class="fal fa-undo"></i>
            </span>
        </div>
        <dl class="user-info">
            <dt class="mes">

        </dl>
    </section>

            <div class="back" id="back">
                <i class="icon fal fa-chevron-left"></i>返回

            <div class="tab-name">

        </div>

            <div class="system-inner">

                    <img src="../img/404.svg" alt="" width="150" />
                </div>
                <h1>抱歉！页面走丢了</h1>
                <p class="jump">
                    页面将在 
                    <span id="wait">10</span>

                </p>
                <p class="goother">
                    <a href="/" class="btn btn-grey">返回首页</a>
                    <a href="javascript:history.back(-1);" class="btn btn-primary">返回上一页</a>
                </p>
            </div>
        </div>
    </aside>

    <script src="../js/libs/requirejs/require.js" data-main="../js/app/404" defer async="true"></script>
