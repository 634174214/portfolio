	<!-- textarea超出高度自适应JS -->
	<script type="text/javascript"> 
	// 最小高度 
	var minHeight = 60; 
	// 最大高度，超过则出现滚动条 
	var maxHeight = 100; 
	function ResizeTextarea(){ 
	var t = document.getElementById('txtContent'); 
	h = t.scrollHeight; 
	h = h > minHeight ? h : minHeight; 
	h = h > maxHeight ? maxHeight : h; 
	t.style.height = h + "px"; 
	} 
	</script>
