    <section class="container-wrapper">
      <h1 class="my-h1">发布服务</h1>

      <form class="layui-form" action="">
        <div class="layui-form-item">
          <label class="layui-form-label">标题</label>
          <div class="layui-input-block">
            <input type="text" name="title" required  lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input">
            <p class="my-input-error"><i class="layui-icon layui-icon-tips"></i> 抱歉，这里显示验证报错的信息</p>
          </div>
        </div>
        <div class="layui-form-item layui-form-text">
          <label class="layui-form-label">概要</label>
          <div class="layui-input-block">
            <textarea name="desc" placeholder="请输入概要" class="layui-textarea"></textarea>
            <p class="my-input-error"><i class="layui-icon layui-icon-tips"></i> 抱歉，这里显示验证报错的信息</p>
          </div>
        </div>
        
        <div class="layui-form-item">
          <label class="layui-form-label">价格</label>
          <div class="layui-input-block">
            <input type="text" name="title" required  lay-verify="required" placeholder="请输入价格，单位：元" autocomplete="off" class="layui-input">
            <p class="my-input-error"><i class="layui-icon layui-icon-tips"></i> 抱歉，这里显示验证报错的信息</p>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">上传封面</label>
          <div class="layui-input-block">
            <div class="my-upload">
              <button type="button" class="layui-btn" id="upload-preview">
                <i class="layui-icon">&#xe67c;</i> 上传封面图片
              </button>
            </div>
            <div class="my-upload-preview">
              <!-- <img src="image/发布服务.jpg"> -->
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <label class="layui-form-label">文件上传</label>
          <div class="layui-input-block">
            <div class="layui-upload-drag" id="upload-something">
              <i class="layui-icon"></i>
              <p>点击上传，或将文件拖拽到此处</p>
              <div class="layui-hide" id="uploadDemoView">
                <hr>
                <img src="" alt="上传成功后渲染" style="max-width: 196px">
              </div>
            </div>
          </div>
        </div>
        <div class="layui-form-item">
          <div class="layui-input-block">
            <button class="layui-btn layui-btn-lg my-submit-fuwu" lay-submit lay-filter="formSubmit" >立即提交</button>
          </div>
        </div>
      </form>
       
    </section>

<script src="layui/layui.js"></script>
<script src="js/backend-run.js"></script>

<script>
  /*
   针对封面上传
  参考：https://layui.gitee.io/v2/docs/modules/upload.html
       https://layui.gitee.io/v2/demo/upload.html
  */
  layui.use('upload', function(){
    var upload = layui.upload;
     
    //执行实例
    var uploadInst = upload.render({
      elem: '#upload-preview' //绑定元素
      ,url: '/upload/' //上传接口
      ,accept: 'jpg,jpeg,png,gif'
      ,size: 5 * 1024 //限制文件大小，单位 KB
      ,done: function(res){
        //上传完毕回调
        // layer.msg('上传成功');
      }
      ,error: function(){
        //请求异常回调
      }
    });

    /*
    参考：https://layui.gitee.io/v2/demo/upload.html
    */
    //拖拽上传 
    upload.render({
        elem: '#upload-something'
        ,url: 'https://httpbin.org/post' //此处用的是第三方的 http 请求演示，实际使用时改成您自己的上传接口即可。
        ,accept: 'file'
        ,done: function(res){
          layer.msg('上传成功');
          layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', res.files.file);
          console.log(res)
        }
      });
  });

</script>
